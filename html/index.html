<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

            button:hover {
                background-color: #0056b3;
            }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }

            .toggle-link a {
                color: #007BFF;
                text-decoration: none;
            }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-box">
            <h2>Login</h2>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <div class="toggle-link">
                Don't have an account? <a href="#" onclick="toggleForms()">Register here</a>
            </div>
        </div>

        <div id="register-box" class="hidden">
            <h2>Register</h2>
            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="reg-role">Role</label>
                    <select id="reg-role" name="role" required>
                        <option value="Senior">Poster</option>
                        <option value="Volunteer">Worker</option>
                    </select>
                </div>
                <button type="submit">Create Account</button>
            </form>
            <div class="toggle-link">
                Already have an account? <a href="#" onclick="toggleForms()">Login here</a>
            </div>
        </div>
    </div>

    <script>
    function toggleForms() {
        document.getElementById('login-box').classList.toggle('hidden');
        document.getElementById('register-box').classList.toggle('hidden');
    }
    </script>

</body>
</html>
